<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFORMATION</title>
<meta name="description" content="Information is a New York / Los Angeles bi-coastal record label and DIY party series.">
<meta name="theme-color" content="#050806">
<meta property="og:type" content="website">
<meta property="og:title" content="Information">
<meta property="og:description" content="New York / Los Angeles bi-coastal record label and DIY party series.">
<meta property="og:image" content="og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="logo-spin.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
--bg:#050806; --metal1:#2c322b; --metal2:#131712; --edge:#434c41;
--teal:#4dffc8; --teal-dim:#1c7a60; --teal-txt:#bdeedd; --rust:#e0642c; --red:#ff3b2f; --bone:#e6e0c8;
--head:'Chakra Petch','Arial Narrow',sans-serif; --mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#020302;color:var(--teal-txt);font-family:var(--mono);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid var(--teal-dim)}
a:hover{background:var(--teal);color:#021a12}
#app{position:fixed;inset:0;padding:10px;display:grid;gap:10px;
grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:34px minmax(0,1fr);
background:radial-gradient(ellipse at 50% 0,#1b211a,#080a08 70%)}
#top{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;padding:0 14px;
font-family:var(--head);letter-spacing:.3em;font-size:13px;color:#8a9a86;text-transform:uppercase}
#top b{color:var(--teal);font-weight:700}
#home{background:none;border:0;padding:6px 8px;margin:-6px -8px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;align-items:center;cursor:pointer}
#home:hover b,#home:focus-visible b{color:#effff8}
#home:focus-visible{outline:1px solid var(--teal-dim)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff6a5c;box-shadow:0 0 8px rgba(255,59,47,.8);margin-right:10px;animation:led 2s infinite}
@keyframes led{50%{opacity:.35}}
.bezel{position:relative;padding:10px;border-radius:8px;border:1px solid var(--edge);
background:linear-gradient(150deg,var(--metal1),var(--metal2));
box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 4px #0b0d0a,inset 0 0 0 5px #2a3028,0 8px 24px rgba(0,0,0,.65)}
.label{font-family:var(--head);font-size:11px;letter-spacing:.3em;color:#7d8c79;text-transform:uppercase;margin-bottom:6px}
#view{grid-column:1;grid-row:2}
.screen{position:relative;height:100%;overflow:hidden;border-radius:4px;background:#030504;
box-shadow:inset 0 0 0 1px #000,inset 0 0 60px rgba(0,0,0,.9),0 0 0 1px #1a211a}
#grid{position:absolute;left:-60%;right:-60%;top:58%;height:80%;
background-image:linear-gradient(rgba(77,255,200,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(77,255,200,.55) 1px,transparent 1px);
background-size:56px 56px;opacity:.18;transform:perspective(380px) rotateX(68deg);animation:grid 3s linear infinite;
-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
@keyframes grid{to{background-position:0 56px}}
#glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(77,255,200,.13),transparent 55%)}
#hub{position:absolute;inset:0 0 80px 0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#logo{position:relative;height:84%;aspect-ratio:563/1000;max-width:80%;animation:glitch 6s infinite steps(1)}
#logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 26px rgba(224,100,44,.3))}
@keyframes glitch{0%,92%,100%{transform:none;clip-path:none}93%{transform:translate(-6px,2px) skewX(6deg)}94%{transform:translate(5px,-2px);clip-path:inset(40% 0 20% 0)}95%{transform:translate(-3px,0);clip-path:inset(10% 0 60% 0)}96%{transform:none;clip-path:none}}
#wordmark{position:absolute;right:14px;bottom:12px;width:clamp(72px,8vw,108px);height:auto;color:var(--teal);opacity:.5;pointer-events:none;z-index:2;filter:drop-shadow(0 0 6px rgba(77,255,200,.35))}
.hud{position:absolute;font-size:12px;letter-spacing:.2em;color:var(--teal);opacity:.8;text-transform:uppercase;pointer-events:none}
.hud{transition:opacity .25s}
body.sec-open .hud.tl,body.sec-open .hud.tr{opacity:0}
.hud.tl{left:14px;top:10px}.hud.tr{right:14px;top:10px;text-align:right}
.hud.bl{left:14px;bottom:86px}.hud.br{right:14px;bottom:86px;text-align:right}
.rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:led 1s infinite}
.hud i{position:absolute;width:16px;height:16px;border:2px solid var(--teal);opacity:.7}
@keyframes blink{50%{opacity:.2}}
#noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.45;z-index:8}
.crt{position:absolute;inset:0;pointer-events:none;z-index:9;
background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.22) 2px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%);
animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.93}52%{opacity:1}}
#panel{position:absolute;inset:14px 16px 90px;z-index:5;display:none;flex-direction:column;
background:rgba(2,9,6,.95);border:1px solid var(--teal-dim);box-shadow:0 0 40px rgba(77,255,200,.14),inset 0 0 50px rgba(77,255,200,.05)}
#panel.on{display:flex;animation:crton .4s ease-out}
@keyframes crton{0%{transform:scaleY(.01);filter:brightness(5)}55%{transform:scaleY(1.02);filter:brightness(2)}100%{transform:none}}
.ph{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--teal-dim);
font-family:var(--head);letter-spacing:.3em;font-size:13px;color:var(--teal);text-transform:uppercase;background:rgba(77,255,200,.06)}
.ph button{background:rgba(255,59,47,.08);border:1px solid #8a3a30;color:#ff6a5c;width:28px;height:28px;padding:0;display:grid;place-items:center;font-family:var(--head);font-size:15px;line-height:1;letter-spacing:0}
.ph button:hover{background:#ff3b2f;border-color:#ff3b2f;color:#fff}
.pb{flex:1;overflow:auto;padding:6px 18px 18px;scrollbar-width:thin;scrollbar-color:var(--teal-dim) transparent}
.row{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #123a2e;align-items:center}
.row:last-child{border:0}
.row h3{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#effff8;line-height:1.1}
.row p{margin-top:3px}
.meta{color:#5fae96;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.date{flex:0 0 84px;text-align:center;border:1px solid var(--rust);color:var(--rust);padding:8px 0;font-family:var(--head);font-weight:700;font-size:32px;line-height:.9;background:rgba(224,100,44,.07)}
.date small{display:block;font-size:11px;letter-spacing:.2em;margin-top:5px;font-weight:500}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding-top:16px}
.card{display:block;border:1px solid var(--teal-dim);background:#040a07;color:inherit;border-bottom:1px solid var(--teal-dim);transition:.2s}
.card:hover{background:#040a07;color:inherit;box-shadow:0 0 18px rgba(77,255,200,.35);transform:translateY(-3px)}
.fly{aspect-ratio:4/5;background:#0a120e;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--teal-dim);font-family:var(--head);letter-spacing:.2em}
.fly img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) contrast(1.05)}
.fly::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.2) 2px 3px);pointer-events:none}
.card:hover .fly img{filter:none}
.cap{padding:9px 10px 11px;display:grid;gap:3px}
.cap b{font-family:var(--head);color:var(--rust);letter-spacing:.14em;font-size:13px}
.cap span{color:#effff8;font-size:14px;line-height:1.25}
.cap em{font-style:normal;color:#5fae96;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#scf{position:fixed;left:-400px;top:0;width:300px;height:166px;border:0;opacity:0;pointer-events:none}
.mp,.np{display:flex;gap:12px;align-items:center}
.pl-art{flex:0 0 52px;width:52px;height:52px;object-fit:cover;border:1px solid var(--teal-dim);background:#0a120e;display:block}
.mt{min-width:0;flex:1}
.pl-title{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.06em;color:#effff8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.pl-sub{font-size:11px;letter-spacing:.14em;color:#5fae96;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{height:12px;margin:12px 0 8px;background:#050806;border:1px solid #2d352c;cursor:pointer}
.pl-fill{display:block;height:100%;width:0;background:linear-gradient(#6dffd6,#2fcba0);-webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.mc{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#8a9a86;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:6px}
.pbtn{width:38px;height:32px;border-radius:4px;border:1px solid #556050;background:linear-gradient(#3a4138,#1a1e18);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 4px #000;display:grid;place-items:center;color:var(--teal)}
.pbtn svg{width:15px;height:15px;fill:currentColor}
.pbtn:hover{box-shadow:0 0 12px rgba(77,255,200,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.pbtn.main{width:50px;color:#021a12;background:linear-gradient(#6dffd6,#2fcba0);border-color:#9affe3}
.pbtn.main.playing{background:linear-gradient(#f07a40,#b24415);color:#fff;border-color:#ffb08a}
.np{margin-top:16px}.np .pl-art{flex-basis:116px;width:116px;height:116px}
.np .pl-title{font-size:21px;white-space:normal;line-height:1.1}
.np .pl-sub{font-size:12px}
.tl-row{display:flex;gap:14px;align-items:center;width:100%;padding:11px 8px;background:none;border:0;border-bottom:1px solid #123a2e;text-align:left;color:inherit;font:inherit}
.tl-row:hover{background:rgba(77,255,200,.07)}
.tl-row.on{background:rgba(77,255,200,.1)}.tl-row.on .tl-n{color:var(--teal)}
body.sc-playing .pl-fill{background:linear-gradient(#f07a40,#b24415)}
body.sc-playing .tl-row.on{background:rgba(224,100,44,.14)}body.sc-playing .tl-row.on .tl-n{color:#f07a40}
.tl-n{font-family:var(--head);color:var(--teal);letter-spacing:.1em}
#dock{position:absolute;left:16px;right:16px;bottom:14px;height:62px;z-index:6;display:flex;align-items:center;gap:14px;padding:7px 12px;
background:rgba(2,9,6,.9);border:1px solid var(--teal-dim);box-shadow:0 0 24px rgba(77,255,200,.12),inset 0 0 30px rgba(77,255,200,.04)}
#dock .pl-art{flex:0 0 44px;width:44px;height:44px}
#dock .mt{flex:1 1 150px;max-width:280px}
.dprog{flex:1 1 200px;min-width:90px}
.dprog .pl-bar{margin:0 0 5px}
.dprog .mc{justify-content:space-between}
body.nodock #dock{display:none}
body.nodock #panel{bottom:16px}
body.nodock .hud.bl,body.nodock .hud.br{bottom:12px}
.soon{min-height:55%;display:grid;place-content:center;text-align:center;gap:10px;padding:60px 0}
.soon-t{font-family:var(--head);font-weight:700;font-size:clamp(26px,5vw,44px);letter-spacing:.35em;padding-left:.35em;color:var(--teal);animation:blink 1.6s steps(2) infinite}
.about{display:flex;flex-wrap:wrap;gap:24px 32px;align-items:flex-start;padding-top:16px}
.clip{flex:0 0 auto;width:min(280px,100%);margin:0}
.clip img{display:block;width:100%;height:auto;border:1px solid var(--teal-dim);box-shadow:0 0 22px rgba(77,255,200,.12)}
.clip figcaption{margin-top:8px;font-family:var(--head);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.about-txt{flex:1 1 260px;min-width:0}
.about-txt .big{margin-top:0}
.tabs{display:flex;gap:6px;margin:12px 0 0}
.tab{font-family:var(--head);letter-spacing:.25em;text-transform:uppercase;font-size:12px;padding:5px 14px;background:linear-gradient(#2e342c,#171b15);border:1px solid #4a5446;color:#8fa08b}
.tab.on{color:#021a12;background:var(--teal);border-color:var(--teal)}
.sc{width:100%;height:min(440px,62vh);border:1px solid var(--teal-dim);display:block;background:#111;margin-top:12px}
.big{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:#effff8;margin:14px 0 6px}
#side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:10px;min-height:0}
#side .bezel{flex:0 0 auto}
#nav{display:grid;grid-template-columns:1fr;gap:8px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 4px 18px;border-radius:6px;
font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#b9c9b4;
background:linear-gradient(#444c41,#1c211a);border:1px solid #5d6959;
box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.5),0 3px 6px #000;transition:.15s}
.nav b{position:absolute;left:8px;top:5px;font-size:10px;color:#6f7d6b;font-weight:500}
.nav::after{content:"";position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:#26301f}
.nav:hover{color:var(--teal);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 14px rgba(77,255,200,.35),0 3px 6px #000}
.nav.on{color:var(--teal);background:linear-gradient(#17261f,#0b130f);border-color:var(--teal-dim);
box-shadow:inset 0 0 18px rgba(77,255,200,.28),0 0 0 1px #000}
.nav.on::after,.nav:hover::after{background:#ff6a5c;box-shadow:0 0 8px rgba(255,59,47,.8)}
.nav:active{transform:translateY(2px)}
#intro{position:fixed;inset:0;z-index:300;background:#020302;display:grid;place-items:center;text-align:center;transition:opacity .7s}
#intro.gone{opacity:0;pointer-events:none}
#intro img{height:44vh;max-height:520px;width:auto;max-width:80vw;display:block;margin:0 auto;filter:drop-shadow(0 0 30px rgba(224,100,44,.25))}
#enter{margin-top:26px;font-family:var(--head);font-size:20px;background:none;border:1px solid var(--teal);color:var(--teal);padding:9px 34px 8px calc(34px + .5em);line-height:1;letter-spacing:.5em;display:none;animation:blink 1.2s steps(2) infinite}
#enter:hover{background:var(--teal);color:#021a12;animation:none}
:root{--tex:1}
#tex{display:contents}
#tex i{position:fixed;display:block;pointer-events:none;z-index:400}
.tx-soft{inset:0;-webkit-backdrop-filter:blur(.35px) contrast(1.06) saturate(1.08);backdrop-filter:blur(.35px) contrast(1.06) saturate(1.08)}
.tx-dots{inset:-30%;background:radial-gradient(circle,rgba(0,0,0,.95) 0 .4px,transparent .9px) 0 0/2px 2px;mix-blend-mode:multiply;opacity:calc(.26*var(--tex));transform:rotate(15deg)}
.tx-mag{inset:-30%;background:radial-gradient(circle,rgba(255,40,140,.9) 0 .4px,transparent .9px) 0 0/2.5px 2.5px;mix-blend-mode:overlay;opacity:calc(.25*var(--tex));transform:rotate(-8deg)}
.tx-cyan{inset:-30%;background:radial-gradient(circle,rgba(0,220,255,.9) 0 .4px,transparent .9px) 0 0/2.5px 2.5px;mix-blend-mode:overlay;opacity:calc(.22*var(--tex));transform:rotate(38deg)}
.tx-grain{will-change:transform;inset:-10%;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='.33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
mix-blend-mode:overlay;opacity:calc(.5*var(--tex));animation:grain .7s steps(1) infinite}
.tx-blot{inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='matrix' values='.33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>") 0 0/600px 600px;
mix-blend-mode:overlay;opacity:calc(.5*var(--tex))}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
@supports (height:100dvh){#app{bottom:auto;height:100dvh}}
@media (max-width:860px){
.tx-mag,.tx-cyan{display:none}
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:28px minmax(0,1fr) auto;padding:6px;gap:6px}
#top{grid-column:1;font-size:11px;letter-spacing:.15em}#top span:last-child{display:none}
#side{grid-column:1;grid-row:3}
.nav{padding:20px 2px 16px;font-size:11px}
#nav{grid-template-columns:repeat(4,1fr)}
#panel{inset:10px 8px 78px}
#dock{left:8px;right:8px;bottom:8px;gap:10px;height:56px}#dock .mt{max-width:none}
.dprog{position:absolute;left:0;right:0;top:-1px;flex:none;min-width:0}.dprog .pl-bar{height:5px;margin:0;border:0}.dprog .mc{display:none}
.hud{font-size:clamp(8px,2.4vw,11px);letter-spacing:.05em}
.hud.tl{left:12px;top:10px}.hud.tr{right:12px;top:10px}
.hud.bl{display:none}
#hub{inset:46px 0 78px 0}
#logo{height:100%}
#wordmark{bottom:10px;right:10px;width:50px}
#dock .pl-art{display:none}#dock{padding:6px 10px}
#dock .ctl{gap:4px}#dock .pbtn{width:34px;height:30px}#dock .pbtn.main{width:44px}
.pl-title{font-size:12px}
body.nodock #panel{inset:10px 8px 8px}
.row{gap:10px}.cover{flex-basis:60px;height:60px}.date{flex-basis:66px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
</style>
</head>
<body>

<div id="intro">
  <div>
    <img id="introLogo" src="logo-spin.webp" alt="Information">
    <button id="enter">ENTER</button>
  </div>
</div>

<div id="tex" aria-hidden="true"><i class="tx-soft"></i><i class="tx-blot"></i><i class="tx-dots"></i><i class="tx-mag"></i><i class="tx-cyan"></i><i class="tx-grain"></i></div>
<iframe id="scf" title="SoundCloud audio" allow="autoplay" tabindex="-1" aria-hidden="true"></iframe>
<div id="app">
  <header id="top"><button type="button" id="home" aria-label="Back to home"><span class="led"></span><b>INFORMATION</b></button><span id="clock">--:--:--</span></header>

  <section id="view" class="bezel">
    <div class="screen">
      <div id="grid"></div><div id="glow"></div>
      <div id="hub"><div id="logo"><img src="logo-spin.webp" alt="Information"></div></div>
      <div class="hud tl">NEW YORK CITY<br>40.7128° N, 74.0060° W</div>

function updateProgress(){
  const d = curDur(), p = d ? Math.min(100, SCP.pos/d*100) : 0;
  document.querySelectorAll('.pl-fill').forEach(e => e.style.width = p+'%');
  document.querySelectorAll('.pl-time').forEach(e => e.textContent = fmt(SCP.pos));
  document.querySelectorAll('.pl-dur').forEach(e => e.textContent = fmt(d));
}
function updatePlayer(){
  document.body.classList.toggle('sc-playing', !!SCP.playing);
  const s = SCP.sounds[SCP.idx];
  document.querySelectorAll('.pl-title').forEach(e => e.textContent = s ? (s.title || 'Mix ' + pad(SCP.idx+1)) : (SCP.ready ? 'Program' : 'Loading set...'));
  document.querySelectorAll('.pl-sub').forEach(e => e.textContent = s ? ((s.user && s.user.username) || 'Information') + ' · ' + (SCP.idx+1) + ' / ' + SCP.sounds.length : 'Information Program');
  document.querySelectorAll('.pl-art').forEach(e => { const u = s && s.artwork_url ? s.artwork_url.replace('-large','-t300x300') : ''; if (u){ if (e.getAttribute('src')!==u) e.src = u; e.style.visibility = 'visible'; } else e.style.visibility = 'hidden'; });
  document.querySelectorAll('[data-pl]').forEach(b => { const k = b.dataset.pl; b.innerHTML = k==='toggle' ? (SCP.playing?ICON.pause:ICON.play) : ICON[k]; b.classList.toggle('playing', k==='toggle' && SCP.playing); });
  document.querySelectorAll('.tl-row').forEach(r => r.classList.toggle('on', +r.dataset.track===SCP.idx));
  updateProgress();
}
// Default sound: the first mix (001 / Slip). Matches by title, falls back to the first track in the set.
function defaultIdx(){ const k = SCP.sounds.findIndex(s => /(?:^|[^0-9])0{0,2}1(?![0-9])|slip/i.test(s.title || '')); return k >= 0 ? k : 0; }
function scPlayDefault(){
  if (!scw || !SCP.ready){ SCP.wantPlay = true; return; }
  SCP.wantPlay = false;
  if (SCP.playing) return;
  if (!SCP.started) scw.skip(defaultIdx());
  setTimeout(() => scw.play(), 250);
}
// SoundCloud fills in track details lazily, so later tracks can arrive without a title. Re-read until every track has one.
function refreshSounds(tries = 0){
  if (!scw) return;
  scw.getSounds(list => {
    if (!list || !list.length) return;
    SCP.sounds = list;
    const t = $('#tracklist'); if (t) t.innerHTML = trackRows();
    updatePlayer();
    if (list.some(s => !s || !s.title) && tries < 8) setTimeout(() => refreshSounds(tries + 1), 2000);
  });
}
function scInit(){
  if (!window.SC || !SC.Widget){ document.body.classList.add('nodock'); return; }
  const f = $('#scf');
  f.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(CONFIG.soundcloud) + '&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
  scw = SC.Widget(f);
  if (current === 'program'){ $('#pbody').innerHTML = views.program(); updatePlayer(); }
  scw.bind(SC.Widget.Events.READY, () => scw.getSounds(list => {
    SCP.sounds = list || []; SCP.ready = true; if (SCP.sounds.length) SCP.idx = defaultIdx();
    const t = $('#tracklist'); if (t) t.innerHTML = trackRows();
    updatePlayer();refreshSounds(); if (SCP.wantPlay) scPlayDefault();
  }));
  scw.bind(SC.Widget.Events.PLAY, () => {
    SCP.playing = true; SCP.started = true;
    refreshSounds();
    scw.getCurrentSoundIndex(i => { SCP.idx = i; updatePlayer(); });
    updatePlayer();
  });
  const stopped = () => { SCP.playing = false; updatePlayer(); };
  scw.bind(SC.Widget.Events.PAUSE, stopped);
  scw.bind(SC.Widget.Events.FINISH, () => { SCP.pos = 0; stopped(); });
  scw.bind(SC.Widget.Events.PLAY_PROGRESS, e => { SCP.pos = e.currentPosition; updateProgress(); });
  scw.bind(SC.Widget.Events.SEEK, e => { SCP.pos = e.currentPosition; updateProgress(); });
}
document.addEventListener('click', e => {
  if (!scw) return;
  const b = e.target.closest('[data-pl]');
  if (b){ const a = b.dataset.pl; if (a==='toggle') scw.toggle(); else if (a==='next') scw.next(); else if (a==='prev') scw.prev(); return; }
  const r = e.target.closest('[data-track]');
  if (r){ scw.skip(+r.dataset.track); setTimeout(() => scw.play(), 250); return; }
  const bar = e.target.closest('.pl-bar');
  if (bar && curDur()){ const rc = bar.getBoundingClientRect(); scw.seekTo((e.clientX - rc.left) / rc.width * curDur()); }
});
updatePlayer();
(function(){ const s = document.createElement('script'); s.src = 'https://w.soundcloud.com/player/api.js'; s.async = true; s.onload = scInit; s.onerror = () => document.body.classList.add('nodock'); document.head.appendChild(s); })();
</script>
